services:
  judge-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: judge-daemon
    init: true
    environment:
      EXEC_MODE: docker
      ENABLE_REDIS: "1"
      REDIS_URL: redis://redis:6379
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - /tmp:/tmp
      - judge-daemon-node-modules:/app/src/daemon/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - judge-network
      - backend-network

  redis:
    image: redis:7-alpine
    container_name: judge-redis
    restart: unless-stopped
    networks:
      - judge-network

networks:
  judge-network:
    driver: bridge
  backend-network:
    external: true
    name: backend_app-network

volumes:
  judge-daemon-node-modules:
