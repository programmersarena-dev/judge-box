version: "3.8"
services:
  judge-daemon:
    build: .
    container_name: judge-daemon
    environment:
      EXEC_MODE: docker
      ENABLE_REDIS: "1"
      REDIS_URL: redis://redis:6379
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - /tmp:/tmp
      - judge-daemon-node-modules:/app/src/daemon/node_modules
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:
      - judge-network
      - backend-network

networks:
  judge-network:
    driver: bridge
  backend-network:
    external: true
    name: backend_app-network

volumes:
  judge-daemon-node-modules:
