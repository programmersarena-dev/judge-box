services:
  judge-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: judge-daemon
    environment:
      NODE_ENV: production
      EXEC_MODE: docker
      ENABLE_REDIS: "1"
      REDIS_URL: redis://redis:6379/0
      LARAVEL_INTERNAL_URL: http://laravel-app/api/v1
      JUDGE_SECRET_TOKEN: ${JUDGE_SECRET_TOKEN:-judge-secret-token}
    volumes:
      - /tmp:/tmp
      - /var/run/docker.sock:/var/run/docker.sock
      - judge-test-cache:/var/cache/judge/tests
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      - "0.0.0.0:3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - backend-network

networks:
  backend-network:
    external: true
    name: backend_app-network

volumes:
  judge-test-cache:
